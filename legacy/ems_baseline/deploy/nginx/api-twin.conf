server {
    listen 80;
    server_name api-twin.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api-twin.example.com;

    ssl_certificate /etc/letsencrypt/live/api-twin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-twin.example.com/privkey.pem;

    location / {
        # Replace with your office/testlab egress ranges
        allow 203.0.113.10;
        allow 198.51.100.0/24;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
