# Optional local monitoring; credentials below are public demo values, not secrets.
services:
  twin-core:
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: eon-lab
      INFLUX_BUCKET: hil-telemetry
      INFLUX_TOKEN: dev_token_12345
      TWIN_GRAFANA_BASE_URL: http://localhost:${AIRPORT_GRAFANA_PORT:-3000}
    depends_on:
      influxdb:
        condition: service_healthy
  influxdb:
    image: influxdb:2.7-alpine
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: airport-demo
      DOCKER_INFLUXDB_INIT_PASSWORD: airport-demo-local-only
      DOCKER_INFLUXDB_INIT_ORG: eon-lab
      DOCKER_INFLUXDB_INIT_BUCKET: hil-telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev_token_12345
    volumes:
      - influx-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: airport-demo
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${AIRPORT_GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - influxdb
      - prometheus
    restart: unless-stopped
volumes:
  influx-data:
  prom-data:
  grafana-data:
