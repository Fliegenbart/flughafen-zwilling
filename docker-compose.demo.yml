name: airport-twin-demo
services:
  twin-core:
    build:
      context: .
      dockerfile: deploy/demo/backend.Dockerfile
    environment:
      TWIN_DATA_DIR: /app/data
      TWIN_ENABLE_PLAYBOOK_SYNTH: "true"
      TWIN_BUILD_GIT_COMMIT: ${TWIN_BUILD_GIT_COMMIT:-demo-unversioned}
      INFLUX_TOKEN: ""
    ports:
      - "127.0.0.1:${AIRPORT_API_PORT:-8010}:8000"
    volumes:
      - twin-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: deploy/demo/frontend.Dockerfile
    depends_on:
      twin-core:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AIRPORT_UI_PORT:-5176}:80"
    restart: unless-stopped
volumes:
  twin-data:
