services:
  twin-core:
    container_name: twin-core
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_HIL_EXTRAS: "true"
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TWIN_DATA_DIR: /app/data
      TWIN_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176,http://localhost:3000,http://127.0.0.1:3000,https://ui-twin.example.vercel.app,https://ui-twin.example.com
      TWIN_ENABLE_PLAYBOOK_SYNTH: "1"
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: eon-lab
      INFLUX_BUCKET: hil-telemetry
      INFLUX_TOKEN: dev_token_12345
    volumes:
      - ${TWIN_HOST_DATA_DIR:-/srv/twin/data}:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - hil_net

  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345!
      DOCKER_INFLUXDB_INIT_ORG: eon-lab
      DOCKER_INFLUXDB_INIT_BUCKET: hil-telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev_token_12345
    volumes:
      - influxdb2_data:/var/lib/influxdb2
    networks:
      - hil_net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - hil_net

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin12345!
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - influxdb
      - prometheus
    networks:
      - hil_net

networks:
  hil_net:
    driver: bridge

volumes:
  influxdb2_data:
  prom_data:
  grafana_data:
