server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Echte Client-IP fuer die Login-Drosselung: nur vom vorgeschalteten Host-Proxy
  # (Docker-Bridge 172.16.0.0/12) wird X-Real-IP uebernommen. Das Backend vertraut
  # per --forwarded-allow-ips nur diesem Container-Netz.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Real-IP;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  location /api/ {
    proxy_pass http://twin-core:8000;
    proxy_read_timeout 130s;
    proxy_buffering off;
  }
  location = /docs { proxy_pass http://twin-core:8000; }
  location = /openapi.json { proxy_pass http://twin-core:8000; }
  location = /runtime-config.js {
    add_header Cache-Control "no-store";
  }
  location / { try_files $uri $uri/ /index.html; }
}
